# ============================================================
# PERFIL TEST - base H2 en memoria
# Las pruebas TDD no dependen de que Postgres este levantado.
# Cada clase de test arranca con la base vacia.
# ============================================================

spring.datasource.url=jdbc:h2:mem:veterinaria_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Sin datos semilla: cada test construye los suyos
spring.sql.init.mode=never