<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetCare - Cambiar Contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Epilogue', sans-serif;
            background-color: #faf8ff;
        }
    </style>
</head>
<body class="min-h-screen bg-[#faf8ff] text-[#0f172a] flex items-center justify-center p-4 sm:p-6 lg:p-10">

<!-- Contenedor Modular Aislado tipo Card -->
<div class="w-full max-w-md bg-white rounded-2xl shadow-[0_4px_25px_rgba(0,0,0,0.04)] border border-[#e2e8f0] p-6 sm:p-8 transition-all">
    <div class="mb-6">
        <h1 class="text-2xl font-bold tracking-tight text-[#0f172a]">
            Cambiar contraseña
        </h1>
        <p class="text-xs text-[#64748b] mt-1.5" th:if="${nombreUsuario != null}">
            Hola <strong class="text-slate-800" th:text="${nombreUsuario}">Usuario</strong>, por seguridad debes actualizar tu contraseña provisional para ingresar al sistema.
        </p>
    </div>

    <!-- Alerta de Error -->
    <div th:if="${mensajeError}" class="mb-5 p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-semibold flex items-center gap-2.5">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
        <span th:text="${mensajeError}"></span>
    </div>

    <form th:action="@{/cambiar-password}" method="post" class="space-y-4">
        <!-- Contraseña Actual -->
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-[#475569] mb-1.5">
                Contraseña actual <span class="text-[#ef4444]">*</span>
            </label>
            <div class="relative flex items-center">
                <div class="absolute left-4 text-[#94a3b8] pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
                <input type="password" id="passwordActual" name="passwordActual" placeholder="Introduce tu contraseña actual" class="w-full pl-12 pr-12 py-3 bg-[#f8fafc] border border-[#e2e8f0] rounded-xl text-sm font-medium text-[#0f172a] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#3b82f6]/20 focus:border-[#3b82f6] transition-all" required autofocus>
                <button type="button" onclick="togglePasswordVisibility('passwordActual')" class="absolute right-4 text-[#94a3b8] hover:text-[#475569] transition-colors p-1" title="Mostrar/Ocultar contraseña">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Nueva Contraseña -->
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-[#475569] mb-1.5">
                Nueva contraseña <span class="text-[#ef4444]">*</span>
            </label>
            <div class="relative flex items-center">
                <div class="absolute left-4 text-[#94a3b8] pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                    </svg>
                </div>
                <input type="password" id="passwordNueva" name="passwordNueva" placeholder="Ingresa tu nueva clave" class="w-full pl-12 pr-12 py-3 bg-[#f8fafc] border border-[#e2e8f0] rounded-xl text-sm font-medium text-[#0f172a] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#3b82f6]/20 focus:border-[#3b82f6] transition-all" required>
                <button type="button" onclick="togglePasswordVisibility('passwordNueva')" class="absolute right-4 text-[#94a3b8] hover:text-[#475569] transition-colors p-1" title="Mostrar/Ocultar contraseña">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Confirmar Nueva Contraseña -->
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-[#475569] mb-1.5">
                Confirmar nueva contraseña <span class="text-[#ef4444]">*</span>
            </label>
            <div class="relative flex items-center">
                <div class="absolute left-4 text-[#94a3b8] pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <input type="password" id="confirmacionPassword" name="confirmacionPassword" placeholder="Vuelve a escribir la nueva clave" class="w-full pl-12 pr-12 py-3 bg-[#f8fafc] border border-[#e2e8f0] rounded-xl text-sm font-medium text-[#0f172a] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#3b82f6]/20 focus:border-[#3b82f6] transition-all" required>
                <button type="button" onclick="togglePasswordVisibility('confirmacionPassword')" class="absolute right-4 text-[#94a3b8] hover:text-[#475569] transition-colors p-1" title="Mostrar/Ocultar contraseña">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="pt-1 text-xs text-[#64748b]">
            La contraseña debe tener mínimo 8 caracteres y al menos un número.
        </div>

        <div class="pt-3">
            <button type="submit" class="w-full py-3.5 px-6 rounded-xl bg-[#006c49] hover:bg-[#059669] text-white text-sm font-semibold flex items-center justify-center gap-2 shadow-sm transition-all">
                Actualizar contraseña
            </button>
        </div>
    </form>

    <!-- Opción de cerrar sesión -->
    <div class="mt-6 pt-4 border-t border-slate-100 text-center">
        <form th:action="@{/logout}" method="post" class="inline">
            <button type="submit" class="text-xs text-slate-400 hover:text-red-600 font-medium transition-colors">
                Cerrar sesión
            </button>
        </form>
    </div>
</div>

<script>
    function togglePasswordVisibility(inputId) {
        const input = document.getElementById(inputId);
        if (input) {
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    }
</script>
</body>
</html>
