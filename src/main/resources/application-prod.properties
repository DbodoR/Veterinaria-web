# ============================================================
# PERFIL PROD - servidor publico
# Ningun dato sensible va escrito aqui: todo llega por variables
# de entorno configuradas en el panel del hosting.
# ============================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones acotado: los planes gratuitos de Postgres
# suelen permitir pocas conexiones simultaneas.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# La semilla se ejecuta una sola vez en el primer despliegue.
# Poner DB_INIT_MODE=always para ese arranque y volver a "never" despues.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${DB_INIT_MODE:never}

spring.thymeleaf.cache=true

# El hosting inyecta el puerto en la variable PORT
server.port=${PORT:8080}

logging.level.root=info
logging.level.com.dbodor.veterinariaweb=info