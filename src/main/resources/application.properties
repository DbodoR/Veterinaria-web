spring.application.name=Veterinaria-web

# Perfil activo. En local queda "dev"; en el servidor se sobreescribe
# con la variable de entorno SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA / Hibernate (comun a todos los perfiles) 
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Evita que las sesiones de Hibernate sigan abiertas en la vista.
# Obliga a resolver los LAZY en el servicio, que es lo correcto.
spring.jpa.open-in-view=false

# Zona horaria 
spring.jackson.time-zone=America/Bogota

# Errores
server.error.include-message=always
server.error.include-binding-errors=always