# ============================================================
# PERFIL DEV - base de datos PostgreSQL local
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/veterinaria
spring.datasource.username=veterinaria
spring.datasource.password=veterinaria
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea y actualiza las tablas a partir de las entidades.
# Sirve para avanzar rapido; NO borra datos existentes.
spring.jpa.hibernate.ddl-auto=update

# ---------- Datos semilla ----------
# defer-datasource-initialization es obligatorio: sin el, data.sql
# corre ANTES de que Hibernate cree las tablas y falla.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---------- Logs ----------
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.springframework.security=debug

# ---------- Thymeleaf ----------
# Sin cache para ver los cambios del HTML sin reiniciar
spring.thymeleaf.cache=false

server.port=8081